{% extends "base.html" %}

{% block title %}Đăng ký // Mini Blog ANM{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
    <div class="card" style="padding: 2.25rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h2 style="font-size: 1.6rem; font-weight: 800; color: var(--foreground);">
                Đăng Ký Tài Khoản
            </h2>
        </div>
        
        <form action="/register" method="POST">
            <div class="form-group">
                <label class="form-label">Email <span style="color: red">*</span></label>
                <input type="email" name="email" class="form-control" placeholder="Nhập Email" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Mật khẩu <span style="color: red">*</span></label>
                <div class="password-input-wrapper" style="position: relative;">
                    <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required style="padding-right: 2.5rem;">
                    <button type="button" class="toggle-password-btn" aria-label="Hiện/Ẩn mật khẩu" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted-foreground); display: flex; align-items: center; padding: 0;">
                        <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-off-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                    </button>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label class="form-label">Xác nhận mật khẩu <span style="color: red">*</span></label>
                <div class="password-input-wrapper" style="position: relative;">
                    <input type="password" name="confirm_password" class="form-control" placeholder="Nhập lại mật khẩu" required style="padding-right: 2.5rem;">
                    <button type="button" class="toggle-password-btn" aria-label="Hiện/Ẩn mật khẩu" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted-foreground); display: flex; align-items: center; padding: 0;">
                        <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-off-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full" style="height: 2.5rem;">Đăng Ký</button>
        </form>

        <p style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--muted-foreground);">
            Đã có tài khoản? <a href="/login" style="color: #2563eb; font-weight: 600;">Đăng nhập ngay</a>
        </p>
    </div>
</div>
{% endblock %}
